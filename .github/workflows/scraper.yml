name: Mamuthub Ecosystem Scraper Bot

on:
  schedule:
    # Her gün saat 03:00'te (UTC) otomatik çalışır
    - cron: '0 3 * * *'
  workflow_dispatch: # GitHub arayüzünden manuel tetikleme butonu ekler

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Botun repoya commit ve push yapabilmesi için şarttır

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Scraper Script
        run: node scripts/auto-scraper.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/mockData.ts
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "🤖 [BOT] Otomatik Ekosistem Veri Güncellemesi"
            git push origin HEAD:${{ github.ref_name || 'main' }}
          else
            echo "Güncellenecek yeni değişiklik yok."
          fi
