name: Auto Scraper Bot

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Scraper
        run: node scripts/auto-scraper.js

      - name: Commit and Push
        run: |
          git config --global user.name "Mamuthub Auto Bot"
          git config --global user.email "bot@mamuthub.com"
          git add src/data/mockData.ts
          git commit -m "🤖 [BOT] Otomatik Ekosistem Veri Güncellemesi" || echo "Yeni değişiklik yok"
          git push
