name: Auto Scraper Bot

on:
  schedule:
    - cron: '0 3 * * *' # Her gün gece 03:00 TSİ
  workflow_dispatch:      # Manuel tetikleme butonu

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Scraper
        run: node scripts/auto-scraper.js

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/mockData.ts
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "🤖 [BOT] Otomatik Ekosistem Veri Güncellemesi"
            git push
          else
            echo "Güncellenecek yeni değişiklik yok."
          fi
